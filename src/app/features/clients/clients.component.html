<div
  class="container-fluid p-3 p-md-4 h-100 d-flex flex-column overflow-hidden"
>
  <div
    class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
  >
    <div>
      <h1 class="m-0 fw-bold text-dark fs-2">Directorio de Clientes</h1>
    </div>
    <button
      mat-raised-button
      color="primary"
      class="add-btn fw-bold px-4 py-2 rounded-3"
      (click)="openNewClient()"
    >
      <mat-icon>add</mat-icon> Nuevo Cliente
    </button>
  </div>

  <div class="mb-4">
    <mat-form-field
      appearance="outline"
      class="w-100 bg-white rounded-3 search-field"
      style="max-width: 400px"
    >
      <mat-label>Buscar cliente...</mat-label>
      <mat-icon matPrefix class="text-secondary me-2">search</mat-icon>
      <input
        matInput
        (keyup)="applyFilter($event)"
        class="text-dark"
        placeholder="Ej. Juan Perez o Cédula"
        #input
      />
    </mat-form-field>
  </div>

  <div
    class="flex-grow-1 d-flex flex-column bg-white rounded-3 shadow-sm border overflow-hidden position-relative table-card"
  >
    <div class="flex-grow-1 overflow-auto w-100">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let row">
            <div class="user-cell">
              <div class="avatar">{{ row.name[0] }}</div>
              <div class="info">
                <span class="name">{{ row.name }}</span>
                <span class="id-text">ID: {{ row.id }}</span>
              </div>
            </div>
          </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let row">{{ row.email }}</td>
        </ng-container>

        <!-- Phone Column -->
        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Teléfono</th>
          <td mat-cell *matCellDef="let row">{{ row.phone }}</td>
        </ng-container>

        <!-- Type Column -->
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
          <td mat-cell *matCellDef="let row">
            <span class="type-badge" [class]="row.type | lowercase">{{
              row.type
            }}</span>
          </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
          <td mat-cell *matCellDef="let row">
            <span class="status-indicator" [class]="row.status | lowercase">
              {{ row.status }}
            </span>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <div class="action-buttons">
              <!-- Botón Cotizar -->
              <button
                mat-icon-button
                color="primary"
                matTooltip="Generar Cotización"
                (click)="$event.stopPropagation()"
              >
                <mat-icon>description</mat-icon>
              </button>
              <!-- Botón Ver/Editar -->
              <button
                mat-icon-button
                color="accent"
                (click)="openUpdateClient(row); $event.stopPropagation()"
                matTooltip="Completar Vinculación"
              >
                <mat-icon>edit_note</mat-icon>
              </button>
              <!-- Botón Ver Detalle (Drawer) -->
              <button
                mat-icon-button
                (click)="openClientDetails(row); $event.stopPropagation()"
                matTooltip="Ver Hoja de Vida"
              >
                <mat-icon>visibility</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          (click)="openClientDetails(row)"
          class="clickable-row"
        ></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            No data matching the filter "{{ input.value }}"
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [pageSizeOptions]="[10, 25, 100]"
      aria-label="Select page of users"
    ></mat-paginator>
  </div>
</div>
